# ── 切量控制（机制来自 utils/一键修改_任意切量分组.py）────────────────────────
# 全局切量：UPDATE user_group_common SET radio=<radio> WHERE group_name=<切量名>; + 清 Redis(znzmo:group:all)
# 【提测后回填】group_name(切量名) 与 radio(各组对应切量值，长度因分组不同而不同，需仔细确认)。
split_control:
  table: "user_group_common"
  redis_key: "znzmo:group:all"
  group_name: "downloadConfirmPopTest"
  radio:
    实验组1: "99,-1,-1,-1"
    实验组2: "-1,99,-1,-1"
    对照组1: "-1,-1,99,-1"
    对照组2: "-1,-1,-1,99"
  # 切量埋点表（TRACK 模块查询用，提测后回填表名与字段）
  record_table:
    name: "TODO_切量埋点表名"
    field_date: "TODO_日期字段"
    field_user: "TODO_用户ID字段"
    field_group: "TODO_切量分组字段"

