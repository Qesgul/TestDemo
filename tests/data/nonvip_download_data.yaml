    scenario_name: "40+5组合默认选40知币"
    coupon_combo: "40+5"
    expected_selected: "40"
  - case_id: "DFT-006-b"
    scenario_name: "35+5组合默认选35知币"
    coupon_combo: "35+5"
    expected_selected: "35"
