# ── 模块十三：GIO 埋点期望（TC-AT-050~060）──
# 实况探针（2026-06-04）确认：上报端点 api.growingio.com，body LZString 压缩，
# render_* 事件真实触发，复用项目现有 gio_tracking fixture + decode_gio_body。
#
# ⚠️  一致性约定：
#   - 此段是埋点事件的「规范声明」，用例里 gio_tracking.assert_event(identifier)
#     使用的 identifier 字符串必须与 events[*].identifier 保持一致。
#   - 若修改事件名（identifier），必须同步更新 TestYunxuanTracking 的 assert_event 调用。
#   - tracking: events 段本身不被 landing 用例程序化消费（不调用 load_gio_expectations），
#     纯作为人工可读的规范记录；tracking_meta: 段才是数据驱动用例读取的数据源。
tracking:
  requirement: "云渲染落地页 GIO 自定义埋点"
  events:
    # ── active（可自动化断言）──────────────────────────────────
    - identifier: render_screen_show
      name: 落地页_屏幕曝光
      trigger: 页面滚动到对应屏时触发，每屏仅上报一次
      expect_vars:
        data2: "第1屏"   # 每条用例按需覆写断言

    - identifier: render_full_view
      name: 落地页_完整浏览
      trigger: 滚动至第七屏底部
      expect_vars: {}

    - identifier: render_download_click
      name: 落地页_下载点击
      trigger: 点首屏 CTA → 选 Popover 版本项（两步流程）
      expect_vars:
        data: "Banner"
        data2: "首屏CTA-Win10"

    # ── pending（依赖登录态/接口桩/研发补埋）──────────────────
    - identifier: render_bonus_click
      name: 落地页_福利领取
      trigger: 已登录用户领取福利（成功/失败）
      status: pending
      expect_vars: {}

    - identifier: render_case_click
      name: 落地页_案例点击
      trigger: 第四屏点击案例卡片
      status: pending
      # 【研发缺陷】实测 .ylCaseCard 为纯 <img> 静态，无点击 handler，
      # render_case_click 从未上报。需研发在卡片上补绑事件。
      expect_vars: {}

    - identifier: render_review_click
      name: 落地页_评价点击
      trigger: 第六屏点击评价卡片
      status: pending
      # 【研发缺陷】实测 .ylReviewCard 为静态 div，无点击 handler，
      # render_review_click 从未上报。需研发在卡片上补绑事件。
      expect_vars: {}

