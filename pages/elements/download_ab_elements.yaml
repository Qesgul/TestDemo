# 下载确认弹窗 AB 实验 - 元素定位器
# 适用站点: su.znzmo.com 付费素材详情页（36知币）；弹窗 = DownloadConfirmModal
#
# 复用说明（继承自 nonvip_download_elements.yaml，本文件不重复声明，避免 update() 空值覆盖）：
#   download_dialog / dialog_close / confirm_btn / total_amount / discount_amount
#   / download_vocher_section / detail_page_price
#
# 切量已确认：group_name=downloadConfirmPopTest  0=实验组1(99,-1,-1,-1) 1=实验组2 2=对照组1 3=对照组2
# 2026-06-09 已通过 Playwright headed 完成部分 selector 抓取（详见各行注释）；
# 仍为 TODO_SELECTOR 的 3 项（detail_coupon_price/vip_pending_tag/coupon_unused_row）
# 在当前已部署版本所有分组 DOM 中均未发现，待前端部署后用 ai-selector 重新抓取回填。

# ── 详情页价格区（实验组：展示到手价，不展示券后价）────────────────────────────
# ✓ 2026-06-09 Playwright headed 实抓验证（EXP-VIP="0知币" CTRL-nonVIP="19知币" count=1）
# 注：此元素在实验组/对照组均存在，显示当前有效价格（到手价）；
#   PRD "_hasToHandPrice" 专属标签在所有已测分组 DOM 中均未发现独立节点，以此元素承载。
detail_take_price: '[class^="Commodity3dDescription__priceValue__"]'   # 详情页有效价格（到手价）节点
# TODO_SELECTOR："券后价"字样在实验组/对照组1/对照组2（无券+有券）六种状态 DOM 中均未发现，
#   确认当前未部署，提测部署后用 ai-selector 重新抓取。
detail_coupon_price: 'TODO_SELECTOR'  # 详情页"券后价"字样节点（实验组期望取不到；当前未部署）

# ── 弹窗价格明细行 ───────────────────────────────────────────────────────────
# 活动立减行 ✓ 2026-06-09 Playwright headed 实抓（VIP+非VIP 均确认 "活动立减 -12知币"）
activity_discount_row: '[class^="DownloadConfirmModal__officialSub__"]'
# VIP立减行 ✓ 两账号均见 "VIP立减 -5知币"
vip_discount_row: '[class^="DownloadConfirmModal__vipReduce__"]'
# TODO_SELECTOR："待激活"字样在对照组1/2（无券+有券）所有状态 DOM 中均未出现；
#   当前对照组 nonVIP 弹窗 vipReduce 行文案为 "VIP立减"（非 "待激活"），可能未部署或需特定分组。
#   提测完整部署后用 ai-selector 抓取唯一命中节点回填。
vip_pending_tag: 'TODO_SELECTOR'         # "待激活 -5知币"标签（对照组图2 才有；当前 DOM 未发现）
# TODO_SELECTOR："不使用"字样在对照组（有券状态）DOM 中未发现；
#   免费下载券自动选中且无法取消选中，当前版本可能未部署此交互行。
coupon_unused_row: 'TODO_SELECTOR'       # 灰色"不使用 >"行（有券未选时出现；当前未部署）

# ── 省钱礼包搭售区（对照组/非VIP 有；实验组/VIP 无）────────────────────────────
# ✓ 2026-06-09 非VIP账号实抓（"购买省钱礼包，每次下载都省钱 5知币下载券 20张…"）
promo_bundle: '[class^="DownloadConfirmModal__libaoContent__"]'

# ── 底部条与主按钮 ───────────────────────────────────────────────────────────
# 主按钮 ✓ 与 confirm_btn 同节点；文案 VIP="立即下载"，非VIP="立即下载"（勾选搭售后变"支付并下载"）
main_button: '[class^="DownloadConfirmModal__right__"]'
# 底部合计条（"合计X知币 已优惠X知币"，不含按钮）✓ 2026-06-09 实抓
bottom_bar: '[class^="DownloadConfirmModal__left__"]'
# ✓ 2026-06-09 Playwright headed 实抓（对照组+非VIP勾选套餐后 count=1，文案="+"；勾选前 count=0）
bottom_cash: '[class^="DownloadConfirmModal__addsymbol__"]'  # 底部"+X元"现金符号（仅勾选套餐后出现）

# ── 弹窗顶部素材信息块（EXP-025 需求补全：假一赔三/缩略图/标题/ID/标签）──────────
# ✓ 2026-06-09 Playwright headed 实抓
material_block: '[class^="DownloadConfirmModal__commodityInfo__"]'
material_thumb: '[class^="DownloadConfirmModal__comImg__"]'
material_title: '[class^="DownloadConfirmModal__title__"]'
material_id: '[class^="DownloadConfirmModal__comId__"]'
material_tags: '[class^="DownloadConfirmModal__activeSkuInfo__"]'
guarantee_badge: '[class^="DownloadConfirmModal__payThreeContent__"]'

# ── 搭售套餐勾选项（对照组 CTRL-005：勾选后按钮变"支付并下载"）──────────────────
# ✓ 2026-06-09 非VIP账号实抓；Item1/Item2 class 名完全一致（hash 相同），
#   无法靠 class 区分，改用直接子 + :first-child 唯一命中第一个套餐（5知币×20张 ¥6.9）。
#   注：:first-child 为标准 CSS 伪类，非 Playwright .first() 方法，符合 skill 规则 6。
promo_package_option: '[class^="DownloadConfirmModal__twoLibaoDiv__"] > [class^="DownloadConfirmModal__twoLibaoItem__"]:first-child'
